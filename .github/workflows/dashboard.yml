# Builds the React dashboard and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Every non-PR run exports fresh data from Databricks first (needs the DATABRICKS_HOST and
# DATABRICKS_TOKEN repository secrets). If the export fails, it reuses the data the live site
# already serves; without the secrets, or failing that, it builds from the committed export in
# frontend/public/data. The map and next-trains board also poll the live-api
# Vercel function (live-api/, deployed by Vercel on push) and fall back to the export without it.
name: Dashboard

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["frontend/**"]
  schedule:
    # Every 2 h at :40 UTC. The Databricks job runs every 2 h at :10 Chicago time, so this lands 30 min
    # after it on CST and 90 min after it on CDT. GitHub may start scheduled runs late.
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The export writes one file per query, so it goes to a temp dir and replaces the committed files
      # only if every query succeeded. The token is scoped to this step, away from npm packages.
      - name: Export fresh data from Databricks
        id: export
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::notice::No DATABRICKS_TOKEN secret; building from the committed export."
            exit 0
          fi
          pip install -r requirements.txt
          python databricks/export_dashboard_data.py --out "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP"/export/*.json frontend/public/data/
      # CI exports are never committed, so the committed one can be weeks old. When Databricks is down
      # (e.g. the Free Edition quota), rebuild from the data the live site already serves, if newer, so
      # the dashboard stays frozen at its last export instead of rolling back.
      - name: Keep the live site's data
        if: github.event_name != 'pull_request' && steps.export.outcome == 'failure'
        continue-on-error: true
        working-directory: .
        run: |
          echo "::warning::The Databricks export failed; see the step above."
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data"
          live="$RUNNER_TEMP/live"
          mkdir -p "$live"
          curl -fsSL "$base/manifest.json" -o "$live/manifest.json"
          if ! jq -e --slurpfile c frontend/public/data/manifest.json \
              '.schema_version == $c[0].schema_version and .exported_at_ms > $c[0].exported_at_ms' \
              "$live/manifest.json" > /dev/null; then
            echo "The live site's data is no newer than the committed export; building from that."
            exit 0
          fi
          for name in $(jq -r '.files | keys[]' "$live/manifest.json"); do
            curl -fsSL "$base/$name.json" -o "$live/$name.json"
          done
          cp "$live"/*.json frontend/public/data/
          echo "Building from the live site's export (service dates to $(jq -r .last_service_date "$live/manifest.json"))."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Pages serves the site at /<repo-name>/. GITHUB_REPOSITORY ("owner/name") is set on every
      # event, unlike github.event.repository, which scheduled runs may not have.
      - run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
        env:
          VITE_LIVE_API_URL: https://cta-transit-live.vercel.app/api/live
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    # Pages can't serve a private repo on the free plan; deploys start once the repo is public.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
