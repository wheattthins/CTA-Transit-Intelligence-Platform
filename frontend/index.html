<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CTA 'L' train prediction accuracy, headways and service reliability, inferred from Train Tracker data." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>CTA Transit Intelligence</title>
    <!-- Link previews (LinkedIn, Slack, etc.). Crawlers need absolute URLs, so these name the
         GitHub Pages address. The image source is scripts/og_image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CTA Transit Intelligence" />
    <meta property="og:title" content="How accurate are Chicago's 'L' train arrival predictions?" />
    <meta property="og:description" content="An automated Databricks lakehouse that collects every CTA train prediction, infers real arrival times, and measures accuracy, headways and service gaps across all 8 lines." />
    <meta property="og:url" content="https://wheattthins.github.io/CTA-Transit-Intelligence-Platform/" />
    <meta property="og:image" content="https://wheattthins.github.io/CTA-Transit-Intelligence-Platform/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="CTA Transit Intelligence: how accurate are Chicago's 'L' train arrival predictions?" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint (no flash). Storage can be unavailable; ignore errors.
      try {
        const t = localStorage.getItem("cta-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
