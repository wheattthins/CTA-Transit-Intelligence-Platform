<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CTA 'L' train prediction accuracy, headways and service reliability, inferred from Train Tracker data." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>CTA Transit Intelligence</title>
    <script>
      // Apply the saved theme before first paint (no flash). Storage can be unavailable; ignore errors.
      try {
        const t = localStorage.getItem("cta-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
